<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="848" viewBox="0 0 1600 848">
  <rect width="1600" height="848" fill="#efefef"/>

  <!-- Left text blocks -->
  <g fill="#a20011" font-family="Arial, Helvetica, sans-serif">
    <text x="38" y="70" font-size="38" font-weight="700">Mission</text>
    <text x="182" y="68" font-size="24" font-weight="700">Mission to fulfill</text>
    <line x1="38" y1="82" x2="760" y2="82" stroke="#a20011" stroke-width="1"/>

    <text x="38" y="125" fill="#333" font-size="38">Create a world liberated from</text>
    <text x="38" y="165" fill="#333" font-size="38">everything that hinders the desire to be beautiful.</text>

    <text x="38" y="310" font-size="38" font-weight="700" fill="#a20011">Vision</text>
    <text x="132" y="308" font-size="24" font-weight="700" fill="#a20011">Future we want to realize</text>
    <line x1="38" y1="324" x2="674" y2="324" stroke="#a20011" stroke-width="1"/>

    <text x="38" y="365" fill="#333" font-size="38">Through the challenge of offering top-brand quality</text>
    <text x="38" y="405" fill="#333" font-size="38">at one-third of the price, we will provide mature</text>
    <text x="38" y="445" fill="#333" font-size="38">women with the joy of embracing quality every day.</text>

    <text x="38" y="552" font-size="38" font-weight="700" fill="#a20011">Value</text>
    <text x="124" y="550" font-size="24" font-weight="700" fill="#a20011">Promised values / strengths</text>
    <line x1="38" y1="565" x2="586" y2="565" stroke="#a20011" stroke-width="1"/>

    <text x="38" y="610" fill="#333" font-size="38">Value that exceeds expectations</text>
    <text x="38" y="650" fill="#333" font-size="38">· Gene-level anti-aging care research</text>
    <text x="38" y="690" fill="#333" font-size="38">· “Sensory quality” that resonates with all five senses</text>
    <text x="38" y="730" fill="#333" font-size="38">· Reliable quality and affordable prices that are easy to sustain</text>
  </g>

  <!-- Pyramid -->
  <defs>
    <linearGradient id="gradBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b6001a"/>
      <stop offset="100%" stop-color="#c98780"/>
    </linearGradient>
    <linearGradient id="gradMiddle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bc1d2b"/>
      <stop offset="100%" stop-color="#c27a70"/>
    </linearGradient>
    <linearGradient id="gradTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b5001a"/>
      <stop offset="100%" stop-color="#cd948d"/>
    </linearGradient>
  </defs>

  <polygon points="528,807 1047,807 960,565 612,565" fill="url(#gradBottom)"/>
  <polygon points="612,565 960,565 880,325 694,325" fill="url(#gradMiddle)"/>
  <polygon points="694,325 880,325 845,170 738,170" fill="url(#gradTop)"/>
  <polygon points="738,170 845,170 789,82" fill="#b10019"/>

  <line x1="815" y1="82" x2="845" y2="82" stroke="#a20011" stroke-width="1"/>
  <line x1="845" y1="82" x2="1102" y2="807" stroke="#a20011" stroke-width="1"/>
  <line x1="1074" y1="807" x2="1102" y2="807" stroke="#a20011" stroke-width="1"/>

  <g fill="#fff" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="786" y="247" font-size="39" font-weight="700">Mission</text>
    <text x="786" y="273" font-size="30" font-weight="700">Mission to fulfill</text>

    <text x="786" y="447" font-size="39" font-weight="700">Vision</text>
    <text x="786" y="473" font-size="30" font-weight="700">Future we want to realize</text>

    <text x="786" y="682" font-size="39" font-weight="700">Value</text>
    <text x="786" y="708" font-size="30" font-weight="700">Promised values / strengths</text>
  </g>

  <!-- Right text -->
  <g fill="#a20011" font-family="Arial, Helvetica, sans-serif">
    <text x="1038" y="268" font-size="38" font-weight="700">Brand Message / Tagline</text>
    <text x="1038" y="380" font-size="72" font-family="Times New Roman, serif">Unleash quality.</text>
  </g>
</svg>
